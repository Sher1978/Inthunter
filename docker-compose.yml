version: '3.8'

services:
  outreach:
    build: .
    container_name: leadradar_outreach
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEAD_MAN_TIMEOUT_SECONDS=300
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
