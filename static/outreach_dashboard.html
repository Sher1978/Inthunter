<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outreach AI Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-8 text-gray-800">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-blue-600">Управление AI Менеджерами (Аутрич)</h1>

        <!-- Проекты -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Проекты</h2>
            <div id="projects-list" class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Отрисовка проектов через JS -->
            </div>
            
            <h3 class="text-lg font-semibold mt-6 mb-2">Создать новый проект</h3>
            <form id="project-form" class="space-y-4 max-w-lg">
                <input type="text" id="proj-name" placeholder="Название (напр. B2B Revo)" class="w-full border p-2 rounded" required>
                <textarea id="proj-kb" placeholder="База знаний (Markdown/Текст)" class="w-full border p-2 rounded h-32"></textarea>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Создать Проект</button>
            </form>
        </div>

        <!-- Задачи -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Задачи (Кампании)</h2>
            <h3 class="text-lg font-semibold mt-6 mb-2">Создать задачу для проекта</h3>
            <form id="task-form" class="space-y-4 max-w-lg mb-8">
                <select id="task-project-id" class="w-full border p-2 rounded" required>
                    <option value="">-- Выберите Проект --</option>
                </select>
                <input type="text" id="task-name" placeholder="Название задачи (напр. Риелторы Дубай)" class="w-full border p-2 rounded" required>
                <textarea id="task-prompt" placeholder="Промпт персоны (Вы Екатерина, работаете в...)" class="w-full border p-2 rounded h-32"></textarea>
                <div class="flex space-x-4">
                    <input type="time" id="task-start" value="09:00" class="w-1/2 border p-2 rounded">
                    <input type="time" id="task-end" value="18:00" class="w-1/2 border p-2 rounded">
                </div>
                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Создать Задачу</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/outreach';

        async function loadProjects() {
            try {
                const res = await fetch(`${API_URL}/projects`);
                const projects = await res.json();
                
                const list = document.getElementById('projects-list');
                const select = document.getElementById('task-project-id');
                
                list.innerHTML = '';
                select.innerHTML = '<option value="">-- Выберите Проект --</option>';

                projects.forEach(p => {
                    list.innerHTML += `
                        <div class="border p-4 rounded bg-gray-50">
                            <div class="font-bold text-lg">${p.name}</div>
                            <div class="text-sm text-gray-500">ID: ${p.id} | Status: ${p.status}</div>
                        </div>
                    `;
                    select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                });
            } catch (err) {
                console.error("Ошибка загрузки проектов:", err);
            }
        }

        document.getElementById('project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('proj-name').value,
                knowledge_base: document.getElementById('proj-kb').value
            };
            await fetch(`${API_URL}/projects`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            document.getElementById('project-form').reset();
            loadProjects();
        });

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                project_id: parseInt(document.getElementById('task-project-id').value),
                name: document.getElementById('task-name').value,
                persona_prompt: document.getElementById('task-prompt').value,
                working_hours_start: document.getElementById('task-start').value,
                working_hours_end: document.getElementById('task-end').value
            };
            await fetch(`${API_URL}/tasks`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            alert('Задача успешно создана!');
            document.getElementById('task-form').reset();
        });

        loadProjects();
    </script>
</body>
</html>
