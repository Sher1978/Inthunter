# LeadRaDaR Nginx Server Optimization & SEO Canonical Config

# 1. Permanent 301 Redirect HTTP -> HTTPS & Non-WWW Canonical
server {
    listen 80;
    listen [::]:80;
    server_name leadradar.win www.leadradar.win;
    return 301 https://leadradar.win$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.leadradar.win;

    # SSL Certificates Path
    # ssl_certificate /etc/letsencrypt/live/leadradar.win/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/leadradar.win/privkey.pem;

    return 301 https://leadradar.win$request_uri;
}

server {
    listen 443 ssl http2;
    server_name leadradar.win;

    # SSL Certificates Path
    # ssl_certificate /etc/letsencrypt/live/leadradar.win/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/leadradar.win/privkey.pem;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Enable Compression (Gzip & Brotli)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cache Control for Static Assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve llms.txt & robots.txt directly
    location = /llms.txt {
        alias /var/www/leadradar/static/llms.txt;
        add_header Content-Type text/plain;
    }

    location = /robots.txt {
        alias /var/www/leadradar/static/robots.txt;
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        alias /var/www/leadradar/static/sitemap.xml;
        add_header Content-Type application/xml;
    }

    # Proxy to FastAPI App
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
